<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="Global Chemical Traders — поставки промышленного сырья в Казахстан и Центральную Азию.">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { ink:'#071A2F', gold:'#F5B83D', teal:'#06B6D4', lime:'#22C55E' },
  fontFamily: { sans:['Inter','sans-serif'], serif:['"Playfair Display"','serif'] }
}}}
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  html{scroll-padding-top:72px}
  body{font-family:'Inter',sans-serif}
  .grid-bg{background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:56px 56px}
  .gold-text{background:linear-gradient(90deg,#FFD97A,#F5B83D,#FF9F43);-webkit-background-clip:text;background-clip:text;color:transparent}
  .card{transition:transform .25s,box-shadow .25s,border-color .25s}
  .card:hover{transform:translateY(-6px)}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}
  .reveal.in{opacity:1;transform:none}
  .bgimg{background-size:cover;background-position:center;transition:opacity .8s}
  input,select,textarea{font-size:16px}
  .btn-glow{box-shadow:0 8px 30px -6px rgba(245,184,61,.6)}

<body class="bg-white text-slate-700 antialiased overflow-x-hidden selection:bg-gold selection:text-ink">

<!-- HEADER -->
<header class="fixed top-0 inset-x-0 z-40 bg-ink/85 backdrop-blur-lg border-b border-white/10">
  <div class="max-w-7xl mx-auto px-4 sm:px-5 h-16 sm:h-20 flex items-center justify-between">
    <a href="#top" class="flex items-center gap-2 sm:gap-3">
      <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-br from-gold to-orange-500 flex items-center justify-center shadow-lg"><i data-lucide="hexagon" class="w-5 h-5 text-ink"></i></div>
      <div class="leading-tight">
        <div class="text-white font-bold tracking-[.08em] sm:tracking-[.18em] text-[11px] sm:text-sm">GLOBAL CHEMICAL</div>
        <div class="text-gold text-[10px] tracking-[.4em] uppercase">Traders</div>
      </div>
    </a>
    <nav class="hidden lg:flex items-center gap-7 text-sm text-slate-200">
      <a href="#why" class="hover:text-gold transition" data-i="n_why"></a>
      <a href="#catalog" class="hover:text-gold transition" data-i="n_catalog"></a>
      <a href="#model" class="hover:text-gold transition" data-i="n_model"></a>
      <a href="#logistics" class="hover:text-gold transition" data-i="n_logistics"></a>
      <a href="#compliance" class="hover:text-gold transition" data-i="n_docs"></a>
      <a href="#about" class="hover:text-gold transition" data-i="n_about"></a>
    </nav>
    <div class="flex items-center gap-2 sm:gap-3">
      <div class="flex items-center bg-white/10 rounded-lg p-1 text-xs font-semibold border border-white/10">
        <button data-lang="ru" class="langbtn px-2 sm:px-2.5 py-1 rounded">RU</button>
        <button data-lang="kz" class="langbtn px-2 sm:px-2.5 py-1 rounded">KZ</button>
        <button data-lang="en" class="langbtn px-2 sm:px-2.5 py-1 rounded">EN</button>
      </div>
      <a href="#contact" class="hidden sm:inline-flex bg-gold hover:bg-yellow-400 text-ink font-bold text-sm px-5 py-2.5 rounded-lg transition" data-i="n_contact"></a>
      <button id="burger" class="lg:hidden text-white p-2" aria-label="Menu"><i data-lucide="menu" class="w-6 h-6"></i></button>
    </div>
  </div>
  <div id="mobileNav" class="hidden lg:hidden bg-ink border-t border-white/10 px-5 py-3 text-slate-200 text-base">
    <a href="#why" class="block py-2.5" data-i="n_why"></a><a href="#catalog" class="block py-2.5" data-i="n_catalog"></a><a href="#model" class="block py-2.5" data-i="n_model"></a>
    <a href="#logistics" class="block py-2.5" data-i="n_logistics"></a><a href="#compliance" class="block py-2.5" data-i="n_docs"></a><a href="#about" class="block py-2.5" data-i="n_about"></a><a href="#contact" class="block py-2.5 text-gold font-semibold" data-i="n_contact"></a>
  </div>
</header>

<!-- HERO -->
<section id="top" class="relative text-white pt-28 sm:pt-40 pb-16 sm:pb-28 overflow-hidden bg-gradient-to-br from-[#0A2A52] via-[#0B6477] to-[#0F9D78]">
  <div class="bgimg absolute inset-0 opacity-0" data-bg="hero"></div>
  <div class="absolute inset-0 bg-gradient-to-r from-[#071A2F]/90 via-[#0A3A55]/70 to-[#0F9D78]/30"></div>
  <div class="absolute inset-0 grid-bg opacity-40"></div>
  <div class="absolute -top-24 -right-24 w-[560px] h-[560px] rounded-full bg-gold/25 blur-3xl"></div>
  <div class="absolute -bottom-24 left-1/3 w-[420px] h-[420px] rounded-full bg-teal/25 blur-3xl"></div>
  <div class="relative max-w-7xl mx-auto px-5 grid lg:grid-cols-12 gap-12 items-center">
    <div class="lg:col-span-7">
      <div class="inline-flex items-center gap-2 text-gold text-xs tracking-[.2em] uppercase border border-gold/50 bg-gold/10 rounded-full px-4 py-1.5 mb-8">
        <span class="w-2 h-2 rounded-full bg-gold animate-pulse"></span> <span data-i="h_badge"></span>
      </div>
      <h1 class="font-serif text-[1.9rem] leading-tight sm:text-5xl lg:text-6xl font-semibold leading-[1.1] mb-7" data-i="h_title" data-html></h1>
      <p class="text-lg text-slate-100 max-w-2xl leading-relaxed mb-10" data-i="h_text"></p>
      <div class="flex flex-wrap gap-4">
        <a href="#contact" class="bg-gold hover:bg-yellow-400 text-ink font-bold px-7 py-4 rounded-lg transition inline-flex items-center justify-center gap-2 btn-glow w-full sm:w-auto"><span data-i="h_cta1"></span> <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
        <a href="#catalog" class="border border-white/40 hover:bg-white hover:text-ink text-white font-semibold px-7 py-4 rounded-lg transition text-center w-full sm:w-auto" data-i="h_cta2"></a>
      </div>
    </div>
    <div class="lg:col-span-5">
      <div class="bg-white/10 border border-white/25 rounded-2xl p-7 backdrop-blur-md shadow-2xl">
        <div class="text-xs uppercase tracking-[.25em] text-gold mb-6 font-semibold" data-i="kpi_title"></div>
        <div class="grid grid-cols-2 gap-6">
          <div><div class="font-serif text-3xl sm:text-4xl text-white">150 000+</div><div class="text-xs text-slate-200 mt-1" data-i="k1"></div></div>
          <div><div class="font-serif text-3xl sm:text-4xl text-white">10+</div><div class="text-xs text-slate-200 mt-1" data-i="k2"></div></div>
          <div><div class="font-serif text-3xl sm:text-4xl text-white">50+</div><div class="text-xs text-slate-200 mt-1" data-i="k3"></div></div>
          <div><div class="font-serif text-3xl sm:text-4xl text-white">100%</div><div class="text-xs text-slate-200 mt-1" data-i="k4"></div></div>
        </div>
        <div class="mt-7 pt-6 border-t border-white/20 flex items-center gap-3 text-sm text-slate-100">
          <i data-lucide="map-pin" class="w-4 h-4 text-gold"></i> <span data-i="geo"></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- TRUST STRIP -->
<section class="bg-gradient-to-r from-gold via-orange-400 to-gold text-ink">
  <div class="max-w-7xl mx-auto px-5 py-5 grid grid-cols-2 md:grid-cols-4 gap-4 text-sm font-semibold">
    <div class="flex items-center gap-3"><i data-lucide="file-check-2" class="w-5 h-5"></i> <span data-i="s1"></span></div>
    <div class="flex items-center gap-3"><i data-lucide="receipt" class="w-5 h-5"></i> <span data-i="s2"></span></div>
    <div class="flex items-center gap-3"><i data-lucide="train-front" class="w-5 h-5"></i> <span data-i="s3"></span></div>
    <div class="flex items-center gap-3"><i data-lucide="lock" class="w-5 h-5"></i> <span data-i="s4"></span></div>
  </div>
</section>

<!-- WHY -->
<section id="why" class="py-16 sm:py-28 bg-gradient-to-b from-sky-50 to-white">

    <div class="max-w-3xl mb-16 reveal">
      <div class="text-teal font-bold text-xs tracking-[.3em] uppercase mb-4" data-i="w_tag"></div>
      <h2 class="font-serif text-3xl sm:text-4xl text-ink leading-tight" data-i="w_title"></h2>
      <p class="text-slate-600 mt-5 leading-relaxed" data-i="w_text"></p>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="card reveal bg-white rounded-2xl p-7 shadow-md hover:shadow-2xl border-t-4 border-teal">
        <div class="w-14 h-14 rounded-xl bg-teal/10 flex items-center justify-center mb-5"><i data-lucide="repeat" class="w-7 h-7 text-teal"></i></div>
        <h3 class="font-bold text-ink mb-2" data-i="w1t"></h3><p class="text-sm text-slate-600 leading-relaxed" data-i="w1d"></p>
      </div>
      <div class="card reveal bg-white rounded-2xl p-7 shadow-md hover:shadow-2xl border-t-4 border-gold">
        <div class="w-14 h-14 rounded-xl bg-gold/15 flex items-center justify-center mb-5"><i data-lucide="factory" class="w-7 h-7 text-orange-500"></i></div>
        <h3 class="font-bold text-ink mb-2" data-i="w2t"></h3><p class="text-sm text-slate-600 leading-relaxed" data-i="w2d"></p>
      </div>
      <div class="card reveal bg-white rounded-2xl p-7 shadow-md hover:shadow-2xl border-t-4 border-lime">
        <div class="w-14 h-14 rounded-xl bg-lime/10 flex items-center justify-center mb-5"><i data-lucide="layout-grid" class="w-7 h-7 text-lime"></i></div>
        <h3 class="font-bold text-ink mb-2" data-i="w3t"></h3><p class="text-sm text-slate-600 leading-relaxed" data-i="w3d"></p>
      </div>
      <div class="card reveal bg-white rounded-2xl p-7 shadow-md hover:shadow-2xl border-t-4 border-violet-500">
        <div class="w-14 h-14 rounded-xl bg-violet-500/10 flex items-center justify-center mb-5"><i data-lucide="route" class="w-7 h-7 text-violet-500"></i></div>
        <h3 class="font-bold text-ink mb-2" data-i="w4t"></h3><p class="text-sm text-slate-600 leading-relaxed" data-i="w4d"></p>
      </div>
    </div>
  </div>
</section>

<!-- CATALOG -->
<section id="catalog" class="py-16 sm:py-28 bg-gradient-to-b from-white via-amber-50/60 to-white">
  <div class="max-w-7xl mx-auto px-5">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-14 reveal">
      <div>
        <div class="text-orange-500 font-bold text-xs tracking-[.3em] uppercase mb-4" data-i="c_tag"></div>
        <h2 class="font-serif text-3xl sm:text-4xl text-ink" data-i="c_title"></h2>
      </div>
      <p class="text-slate-600 max-w-md text-sm leading-relaxed" data-i="c_text"></p>
    </div>
    <div id="productGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-7"></div>
  </div>
</section>

<!-- MODEL -->
<section id="model" class="relative py-16 sm:py-28 text-white overflow-hidden bg-gradient-to-br from-[#0A2A52] via-[#0B5C73] to-[#0A8A6B]">
  <div class="bgimg absolute inset-0 opacity-0" data-bg="model"></div>
  <div class="absolute inset-0 bg-gradient-to-br from-[#071A2F]/90 via-[#0A3A55]/80 to-[#0A8A6B]/60"></div>
  <div class="absolute inset-0 grid-bg opacity-30"></div>
  <div class="relative max-w-7xl mx-auto px-5">
    <div class="max-w-3xl mb-16 reveal">
      <div class="text-gold text-xs tracking-[.3em] uppercase mb-4 font-bold" data-i="m_tag"></div>
      <h2 class="font-serif text-3xl sm:text-4xl leading-tight" data-i="m_title"></h2>
    </div>
    <div class="grid md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="reveal border border-white/20 rounded-2xl p-7 bg-white/10 backdrop-blur"><div class="font-serif text-5xl gold-text mb-4">01</div><h3 class="font-bold mb-2" data-i="m1t"></h3><p class="text-sm text-slate-100 leading-relaxed" data-i="m1d"></p></div>
      <div class="reveal border border-white/20 rounded-2xl p-7 bg-white/10 backdrop-blur"><div class="font-serif text-5xl gold-text mb-4">02</div><h3 class="font-bold mb-2" data-i="m2t"></h3><p class="text-sm text-slate-100 leading-relaxed" data-i="m2d"></p></div>
      <div class="reveal border border-white/20 rounded-2xl p-7 bg-white/10 backdrop-blur"><div class="font-serif text-5xl gold-text mb-4">03</div><h3 class="font-bold mb-2" data-i="m3t"></h3><p class="text-sm text-slate-100 leading-relaxed" data-i="m3d"></p></div>
      <div class="reveal border border-white/20 rounded-2xl p-7 bg-white/10 backdrop-blur"><div class="font-serif text-5xl gold-text mb-4">04</div><h3 class="font-bold mb-2" data-i="m4t"></h3><p class="text-sm text-slate-100 leading-relaxed" data-i="m4d"></p></div>
    </div>
  </div>
</section>

<!-- INDUSTRIES -->
<section id="industries" class="py-16 sm:py-28 bg-gradient-to-b from-white to-emerald-50">
  <div class="max-w-7xl mx-auto px-5">
    <div class="max-w-3xl mb-14 reveal">
      <div class="text-lime font-bold text-xs tracking-[.3em] uppercase mb-4" data-i="i_tag"></div>
      <h2 class="font-serif text-3xl sm:text-4xl text-ink" data-i="i_title"></h2>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="reveal card rounded-2xl p-7 text-white bg-gradient-to-br from-amber-500 to-orange-600 shadow-lg"><i data-lucide="mountain" class="w-8 h-8 mb-4"></i><h3 class="font-bold mb-2" data-i="i1t"></h3><p class="text-sm text-white/90" data-i="i1d"></p></div>
      <div class="reveal card rounded-2xl p-7 text-white bg-gradient-to-br from-rose-500 to-red-600 shadow-lg"><i data-lucide="flame" class="w-8 h-8 mb-4"></i><h3 class="font-bold mb-2" data-i="i2t"></h3><p class="text-sm text-white/90" data-i="i2d"></p></div>
      <div class="reveal card rounded-2xl p-7 text-white bg-gradient-to-br from-sky-500 to-blue-600 shadow-lg"><i data-lucide="droplets" class="w-8 h-8 mb-4"></i><h3 class="font-bold mb-2" data-i="i3t"></h3><p class="text-sm text-white/90" data-i="i3d"></p></div>
      <div class="reveal card rounded-2xl p-7 text-white bg-gradient-to-br from-emerald-500 to-teal-600 shadow-lg"><i data-lucide="fuel" class="w-8 h-8 mb-4"></i><h3 class="font-bold mb-2" data-i="i4t"></h3><p class="text-sm text-white/90" data-i="i4d"></p></div>
    </div>
  </div>
</section>

<!-- LOGISTICS -->
<section id="logistics" class="py-16 sm:py-28 bg-white">
  <div class="max-w-7xl mx-auto px-5 grid lg:grid-cols-2 gap-14 items-center">
    <div class="reveal">
      <div class="text-teal font-bold text-xs tracking-[.3em] uppercase mb-4" data-i="l_tag"></div>
      <h2 class="font-serif text-3xl sm:text-4xl text-ink leading-tight mb-6" data-i="l_title"></h2>
      <p class="text-slate-600 leading-relaxed mb-8" data-i="l_text"></p>
      <div class="space-y-5">
        <div class="flex gap-4"><div class="w-11 h-11 shrink-0 rounded-lg bg-gradient-to-br from-teal to-blue-500 flex items-center justify-center"><i data-lucide="train-front" class="w-5 h-5 text-white"></i></div><div><h4 class="font-bold text-ink" data-i="l1t"></h4><p class="text-sm text-slate-600" data-i="l1d"></p></div></div>
        <div class="flex gap-4"><div class="w-11 h-11 shrink-0 rounded-lg bg-gradient-to-br from-gold to-orange-500 flex items-center justify-center"><i data-lucide="truck" class="w-5 h-5 text-white"></i></div><div><h4 class="font-bold text-ink" data-i="l2t"></h4><p class="text-sm text-slate-600" data-i="l2d"></p></div></div>
        <div class="flex gap-4"><div class="w-11 h-11 shrink-0 rounded-lg bg-gradient-to-br from-lime to-emerald-600 flex items-center justify-center"><i data-lucide="scale" class="w-5 h-5 text-white"></i></div><div><h4 class="font-bold text-ink" data-i="l3t"></h4><p class="text-sm text-slate-600" data-i="l3d"></p></div></div>
      </div>
    </div>
    <div class="reveal relative rounded-3xl overflow-hidden shadow-2xl text-white min-h-[340px] sm:min-h-[420px] bg-gradient-to-br from-[#0A2A52] to-[#0B8A8A]">
      <div class="bgimg absolute inset-0 opacity-0" data-bg="logistics"></div>
      <div class="absolute inset-0 bg-gradient-to-t from-[#071A2F]/95 via-[#071A2F]/60 to-transparent"></div>
      <div class="relative h-full min-h-[340px] sm:min-h-[420px] flex flex-col justify-end p-8">
        <div class="text-xs tracking-[.25em] uppercase text-gold mb-5 font-bold" data-i="lp_title"></div>
        <div class="space-y-4 text-sm">
          <div class="flex justify-between border-b border-white/20 pb-3"><span class="text-slate-200" data-i="lp1"></span><span class="font-bold" data-i="lp1v"></span></div>
          <div class="flex justify-between border-b border-white/20 pb-3"><span class="text-slate-200" data-i="lp2"></span><span class="font-bold" data-i="lp2v"></span></div>
          <div class="flex justify-between border-b border-white/20 pb-3"><span class="text-slate-200" data-i="lp3"></span><span class="font-bold text-right" data-i="lp3v"></span></div>
          <div class="flex justify-between"><span class="text-slate-200" data-i="lp4"></span><span class="font-bold text-right" data-i="lp4v"></span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- COMPLIANCE -->
<section id="compliance" class="py-16 sm:py-28 bg-gradient-to-b from-violet-50 to-white">
  <div class="max-w-7xl mx-auto px-5">
    <div class="max-w-3xl mb-14 reveal">
      <div class="text-violet-500 font-bold text-xs tracking-[.3em] uppercase mb-4" data-i="d_tag"></div>
      <h2 class="font-serif text-3xl sm:text-4xl text-ink" data-i="d_title"></h2>
      <p class="text-slate-600 mt-5" data-i="d_text"></p>
    </div>
    <div class="grid md:grid-cols-3 gap-6">
      <div class="reveal card bg-white rounded-2xl p-8 shadow-md hover:shadow-2xl flex flex-col">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-violet-500 to-indigo-600 flex items-center justify-center mb-5"><i data-lucide="file-text" class="w-7 h-7 text-white"></i></div>
        <h3 class="font-bold text-ink mb-2" data-i="d1t"></h3><p class="text-sm text-slate-600 mb-6 flex-1" data-i="d1d"></p>
        <button onclick="openModal('docs')" class="text-sm font-bold text-violet-600 hover:text-violet-800 text-left flex items-center gap-2"><span data-i="d1b"></span> <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
      </div>
      <div class="reveal card bg-white rounded-2xl p-8 shadow-md hover:shadow-2xl flex flex-col">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-teal to-blue-600 flex items-center justify-center mb-5"><i data-lucide="shield-check" class="w-7 h-7 text-white"></i></div>
        <h3 class="font-bold text-ink mb-2" data-i="d2t"></h3><p class="text-sm text-slate-600 mb-6 flex-1" data-i="d2d"></p>
        <button onclick="openModal('docs')" class="text-sm font-bold text-teal hover:text-blue-700 text-left flex items-center gap-2"><span data-i="d2b"></span> <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
      </div>
      <div class="reveal card bg-white rounded-2xl p-8 shadow-md hover:shadow-2xl flex flex-col">
        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-gold to-orange-500 flex items-center justify-center mb-5"><i data-lucide="landmark" class="w-7 h-7 text-white"></i></div>

        <button onclick="openModal('offer')" class="text-sm font-bold text-orange-500 hover:text-orange-700 text-left flex items-center gap-2"><span data-i="d3b"></span> <i data-lucide="arrow-right" class="w-4 h-4"></i></button>
      </div>
    </div>
  </div>
</section>

    <div class="reveal">
      <div class="text-gold text-xs tracking-[.3em] uppercase mb-4 font-bold" data-i="a_tag"></div>

const LANGS = ['ru','kz','en'];
let lang = 'ru';
try { const s = localStorage.getItem('gct_lang'); if (LANGS.includes(s)) lang = s; } catch(e){}
const L = () => LANGS.indexOf(lang);
const t = key => (K[key] || [key,key,key])[L()];

function applyLang() {
  document.documentElement.lang = lang === 'kz' ? 'kk' : lang;
  document.querySelectorAll('[data-i]').forEach(el => {
    const v = t(el.dataset.i);
    if (el.hasAttribute('data-html')) el.innerHTML = v; else el.textContent = v;
  });
  document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = t(el.dataset.ph));
  document.querySelectorAll('.langbtn').forEach(b => {
    const on = b.dataset.lang === lang;
    b.className = 'langbtn px-2 sm:px-2.5 py-1 rounded transition ' + (on ? 'bg-gold text-ink' : 'text-slate-200 hover:text-white');
  });
  renderProducts(); fillProductSelect();
}
function setLang(l) {
  lang = l; try { localStorage.setItem('gct_lang', l); } catch(e){}
  applyLang(); closeModal();
}
document.querySelectorAll('.langbtn').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));

function loadBg(el, url) {
  const im = new Image();
  im.onload = () => { el.style.backgroundImage = `url("${url}")`; el.style.opacity = el.dataset.op || '1'; };
  im.src = url;
}
document.querySelectorAll('[data-bg]').forEach(el => { el.dataset.op = '.55'; loadBg(el, PHOTOS[el.dataset.bg]); });

async function sendLead(fields, subject) {
  const body = Object.assign({}, fields, { 'Язык сайта': lang.toUpperCase(), _subject: subject, _template: 'table', _captcha: 'false' });
  const res = await fetch(ENDPOINT, { method:'POST', headers:{ 'Content-Type':'application/json', 'Accept':'application/json' }, body: JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok || data.success === 'false' || data.success === false) throw new Error(data.message || 'send error');
  return data;
}
async function handleForm(form, onSuccess) {
  const fields = {}; new FormData(form).forEach((v, k) => fields[k] = v);
  if (fields._honey) return; delete fields._honey;
  const btn = form.querySelector('button[type="submit"]');
  const err = form.querySelector('.form-error');
  const label = btn.querySelector('.btn-label') || btn;
  const original = label.textContent;
  btn.disabled = true; label.textContent = t('sending');
  if (err) err.classList.add('hidden');
  try { await sendLead(fields, form.dataset.subject || 'Заявка с сайта Global Chemical Traders'); onSuccess(); }
  catch (e) { if (err) { err.textContent = t('err') + LEAD_EMAIL; err.classList.remove('hidden'); } }
  finally { btn.disabled = false; label.textContent = original; }
}

function closeModal() { modal.classList.add('hidden'); modal.classList.remove('flex'); }
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function modalSuccess() {
  content.innerHTML = `<div class="text-center py-8"><div class="w-14 h-14 mx-auto rounded-full bg-emerald-100 flex items-center justify-center mb-4"><i data-lucide="check" class="w-7 h-7 text-emerald-600"></i></div>
    <h3 class="font-serif text-2xl text-ink mb-2">${t('ok_t')}</h3><p class="text-slate-600 text-sm mb-6">${t('ok_d')}</p>
    <button onclick="closeModal()" class="bg-ink text-white px-6 py-2.5 rounded-lg text-sm font-semibold">${t('close')}</button></div>`;
  lucide.createIcons();
}
function bindModalForm(subject) {
  const f = content.querySelector('form'); f.dataset.subject = subject;
  f.addEventListener('submit', e => { e.preventDefault(); handleForm(f, modalSuccess); });
}
function openModal(type) {
  if (type === 'offer') {
    content.innerHTML = `<h3 class="font-serif text-2xl text-ink mb-2">${t('mo_offer_t')}</h3><p class="text-slate-600 text-sm mb-6">${t('mo_offer_d')}</p>
      <form class="space-y-4"><input name="Имя / компания" required placeholder="${t('ph_name')}" class="fld"><input name="Контакт" required placeholder="${t('ph_phone')}" class="fld">
      <textarea name="Продукт и объём" rows="2" required placeholder="${t('ph_prodvol')}" class="fld"></textarea>${hp}${submitBtn(t('b_offer'))}</form>`;
    showModal(); bindModalForm('Заявка с сайта: запрос КП');
  } else {
    content.innerHTML = `<h3 class="font-serif text-2xl text-ink mb-2">${t('mo_docs_t')}</h3><p class="text-slate-600 text-sm mb-6">${t('mo_docs_d')}</p>
      <form class="space-y-4"><input type="email" name="Email" required placeholder="${t('ph_email')}" class="fld"><input name="Продукт" required placeholder="${t('ph_prodint')}" class="fld">${hp}${submitBtn(t('b_docs'))}</form>`;
    showModal(); bindModalForm('Заявка с сайта: запрос документов');
  }
}
function openProductModal(i) {
  const p = PRODUCTS[i];
  content.innerHTML = `
    <div class="flex justify-between items-center mb-3"><span class="text-xs font-mono bg-ink text-white px-2.5 py-1 rounded">${p.f}</span><span class="text-xs text-orange-500 font-bold">${p.tag[L()]}</span></div>
    <h3 class="font-serif text-2xl text-ink mb-2">${p.n[L()]}</h3><p class="text-slate-600 text-sm mb-5 leading-relaxed">${p.d[L()]}</p>
    <div class="bg-amber-50 border border-amber-200 rounded-lg p-4 mb-5 text-xs space-y-2">
      <div class="flex justify-between gap-3"><span class="text-slate-500">${t('p_pack')}</span><span class="font-semibold text-slate-800 text-right">${p.p[L()]}</span></div>
      <div class="flex justify-between gap-3"><span class="text-slate-500">${t('p_min')}</span><span class="font-semibold text-slate-800 text-right">${p.m[L()]}</span></div>
      <div class="flex justify-between gap-3"><span class="text-slate-500">${t('p_deliv')}</span><span class="font-semibold text-slate-800">${t('p_deliv_v')}</span></div>
    </div>
    <form class="space-y-3"><input type="hidden" name="Продукт" value="${p.ru}">
      <input name="Имя / компания" required placeholder="${t('ph_name')}" class="fld"><input name="Контакт" required placeholder="${t('ph_phone2')}" class="fld">
      <input name="Объём, тонн" placeholder="${t('ph_vol2')}" class="fld">${hp}${submitBtn(t('b_price'))}</form>`;
  showModal(); bindModalForm('Заявка с сайта: ' + p.ru);
}

/* ================== ОСНОВНАЯ ФОРМА И ПРОЧЕЕ ================== */
const mainForm = document.getElementById('mainForm');
mainForm.addEventListener('submit', e => {
  e.preventDefault();
  handleForm(mainForm, () => { mainForm.classList.add('hidden'); document.getElementById('mainSuccess').classList.remove('hidden'); lucide.createIcons(); });
});
document.getElementById('burger').addEventListener('click', () => document.getElementById('mobileNav').classList.toggle('hidden'));
document.querySelectorAll('#mobileNav a').forEach(a => a.addEventListener('click', () => document.getElementById('mobileNav').classList.add('hidden')));

const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .1 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));

applyLang();
lucide.createIcons();
</script>
</body>
</html>
